<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Jigato</title>

    <link
        rel="stylesheet"
        href="/css/reset-password.css"
    >

</head>


<body>

    <main class="forgot-page">

        <div class="forgot-box">

            <h1>
                Reset Password
            </h1>


            <p>
                Enter your new password below.
            </p>


            <form id="resetPasswordForm">

                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="resetPasswordBtn"
                >
                    Reset Password
                </button>


            </form>


            <!-- MESSAGE -->

            <p
                id="resetMessage"
                style="display:none;"
            ></p>


            <a href="/login">
                ← Back to Login
            </a>

        </div>

    </main>


    <script src="/js/reset-password.js"></script>

</body>

</html>
