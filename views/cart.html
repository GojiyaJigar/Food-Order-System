<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Cart | Jigato</title>


    <!-- NAVBAR CSS -->
    <link
        rel="stylesheet"
        href="/header/navbar.css"
    >

    <!-- CART CSS -->
    <link
        rel="stylesheet"
        href="/css/cart.css"
    >
    <link
    rel="stylesheet"
    href="/footer/footer.css"
>

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<div id="navbar"></div>


<!-- =====================================================
     CART
===================================================== -->

<section class="cart-section">

    <div class="cart-header">

        <span class="section-label">
            YOUR ORDER
        </span>

        <h1>
            🛒 My Cart
        </h1>

        <p>
            Review your items before checkout.
        </p>

    </div>


    <div class="cart-container">


        <!-- =================================================
             CART ITEMS
        ================================================== -->

        <div class="cart-items" id="cartItems">

            <div class="cart-loading">
                Loading your cart...
            </div>

        </div>


        <!-- =================================================
             ORDER SUMMARY
        ================================================== -->

        <div class="cart-summary">

            <h2>
                Order Summary
            </h2>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    ₹0
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Delivery Fee
                </span>

                <strong id="delivery">
                    ₹40
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    GST
                </span>

                <strong id="gst">
                    ₹0
                </strong>

            </div>


            <hr>


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <strong id="grandTotal">
                    ₹0
                </strong>

            </div>


            <button
                id="checkoutBtn"
                type="button"
            >

                Proceed To Checkout

                <i class="fa-solid fa-arrow-right"></i>

            </button>


            <a
                href="/restaurant"
                class="continue-shopping"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Continue Shopping

            </a>

        </div>

    </div>

</section>
<div id="footer"></div>


<!-- =====================================================
     SWEET ALERT
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
</script>


<!-- =====================================================
     CART JS
===================================================== -->

<script src="/js/cart.js"></script>


<!-- =====================================================
     NAVBAR JS
===================================================== -->

<script src="/header/navbar.js"></script>
<script src="/footer/footer.js"></script>

</body>

</html>
