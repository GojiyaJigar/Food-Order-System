<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Document Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>My Orders | Jigato</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/header/navbar.css"> <!-- Navbar Stylesheet -->
    <link rel="stylesheet" href="/css/orders.css"> <!-- Orders Page Stylesheet -->
    <link rel="stylesheet" href="/footer/footer.css"> <!-- Footer Stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> <!-- Icons Library -->
</head>

<body>

    <!-- Navigation Bar Container (Injected via JS) -->
    <div id="navbar"></div>

    <!-- Main Content Area -->
    <main class="orders-page">

        <!-- =========================
             Orders Header
        ========================== -->
        <section class="orders-header">
            <div class="orders-header-content">
                <span class="orders-label">ORDER TRACKER</span>
                <h1>
                    <i class="fa-solid fa-box-open"></i>
                    My Orders
                </h1>
                <p>Track your food status in real-time and view your complete order history.</p>
            </div>
        </section>

        <!-- =========================
             Orders Container
        ========================== -->
        <section class="orders-container">

            <!-- Dynamic Orders List -->
            <div id="ordersList">
                <!-- Orders will be rendered here dynamically via orders.js -->
            </div>

            <!-- =========================
                 Order Card Template
            ========================== -->
            <!-- Reference template used by orders.js to clone and render order cards -->
            <template id="orderTemplate">
                <div class="order-card">

                    <div class="order-top">
                        <img class="food-image" src="" alt="Food Image">

                        <div class="order-details">
                            <h2 class="food-name"></h2>
                            <p class="restaurant-name"></p>

                            <div class="order-info">
                                <span class="order-id"></span>
                                <span class="order-date"></span>
                            </div>

                            <div class="payment-info">
                                <span class="payment-method"></span>
                                <span class="total-amount"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Status Badge Section -->
                    <div class="status-section">
                        <h3>Order Status</h3>
                        <div class="status-badge"></div>
                    </div>

                    <!-- Progress Tracker -->
                    <div class="progress-container">
                        <div class="progress-line">
                            <div class="progress-fill"></div>
                        </div>

                        <div class="progress-steps">
                            <div class="step pending">
                                <div class="circle"></div>
                                <span>Pending</span>
                            </div>

                            <div class="step confirmed">
                                <div class="circle"></div>
                                <span>Confirmed</span>
                            </div>

                            <div class="step preparing">
                                <div class="circle"></div>
                                <span>Preparing</span>
                            </div>

                            <div class="step delivery">
                                <div class="circle"></div>
                                <span>Out For Delivery</span>
                            </div>

                            <div class="step delivered">
                                <div class="circle"></div>
                                <span>Delivered</span>
                            </div>
                        </div>
                    </div>

                </div>
            </template>

            <!-- =========================
                 Empty Orders State
            ========================== -->
            <div id="emptyOrders" class="empty-orders" style="display: none;">
                <div class="empty-icon">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h2>No Orders Yet</h2>
                <p>Looks like you haven't placed any orders yet. Discover delicious dishes nearby!</p>
                <a href="/restaurant" class="order-btn">
                    <i class="fa-solid fa-utensils"></i> Order Now
                </a>
            </div>

        </section>

    </main>

    <!-- Footer Container (Injected via JS) -->
    <div id="footer"></div>

    <!-- Third-Party Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- Popup Alerts Library -->

    <!-- Scripts -->
    <script src="/header/navbar.js"></script> <!-- Header Functionality -->
    <script src="/js/orders.js"></script> <!-- Dynamic Orders Page Logic -->
    <script src="/footer/footer.js"></script> <!-- Footer Functionality -->

</body>

</html>
