<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Jigato</title>

    <link
        rel="stylesheet"
        href="/css/forgot-password.css"
    >

</head>


<body>

    <main class="forgot-page">

        <div class="forgot-box">

            <h1>
                Forgot Password?
            </h1>

            <p>
                Enter your registered email address
                and we'll send you a password reset link.
            </p>


            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="sendResetBtn"
                >
                    Send Reset Link
                </button>

            </form>


            <p
                id="forgotMessage"
                style="display:none;"
            ></p>


            <a href="/login">
                ← Back to Login
            </a>

        </div>

    </main>


    <script src="/js/forgot-password.js"></script>

</body>

</html>
