<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your Jigato account password securely."
    >

    <title>Forgot Password | Jigato</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff5a1f;
            --primary-dark: #e84b14;
            --background: #f7f7f7;
            --card: #ffffff;
            --text: #222222;
            --muted: #777777;
            --border: #dddddd;
            --danger: #d93025;
            --success: #188038;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.10);
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(255, 90, 31, 0.10),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 58px;
            height: 58px;

            border-radius: 18px;

            background: var(--primary);
            color: #ffffff;

            font-size: 28px;
            font-weight: 800;

            box-shadow:
                0 12px 30px rgba(255, 90, 31, 0.28);
        }

        .brand-name {
            margin-top: 12px;

            font-size: 27px;
            font-weight: 800;

            letter-spacing: -0.5px;
        }

        .brand-name span {
            color: var(--primary);
        }

        .card {
            background: var(--card);

            border: 1px solid rgba(0, 0, 0, 0.05);

            border-radius: 22px;

            padding: 38px;

            box-shadow: var(--shadow);
        }

        .icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 22px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 90, 31, 0.10);

            color: var(--primary);

            font-size: 28px;
        }

        .heading {
            text-align: center;
            margin-bottom: 10px;
        }

        .heading h1 {
            font-size: 27px;
            line-height: 1.25;

            margin-bottom: 10px;
        }

        .heading p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .form {
            margin-top: 28px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 650;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #999;

            font-size: 17px;

            pointer-events: none;
        }

        .field input {
            width: 100%;

            height: 52px;

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 0 16px 0 45px;

            outline: none;

            font-size: 15px;

            color: var(--text);

            background: #ffffff;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .field input::placeholder {
            color: #aaa;
        }

        .field input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(255, 90, 31, 0.10);
        }

        .field input.input-error {
            border-color: var(--danger);

            box-shadow:
                0 0 0 4px rgba(217, 48, 37, 0.08);
        }

        .field-error {
            display: none;

            margin-top: 7px;

            color: var(--danger);

            font-size: 13px;
        }

        .field-error.show {
            display: block;
        }

        .message {
            display: none;

            padding: 13px 14px;

            border-radius: 11px;

            margin-bottom: 18px;

            font-size: 14px;

            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.success {
            color: var(--success);

            background: rgba(24, 128, 56, 0.08);

            border: 1px solid rgba(24, 128, 56, 0.18);
        }

        .message.error {
            color: var(--danger);

            background: rgba(217, 48, 37, 0.08);

            border: 1px solid rgba(217, 48, 37, 0.18);
        }

        .submit-btn {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 12px;

            background: var(--primary);

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease,
                box-shadow 0.2s ease;

            box-shadow:
                0 8px 20px rgba(255, 90, 31, 0.22);
        }

        .submit-btn:hover {
            background: var(--primary-dark);

            box-shadow:
                0 10px 24px rgba(255, 90, 31, 0.28);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .submit-btn:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            box-shadow: none;
        }

        .btn-content {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;
        }

        .spinner {
            width: 17px;
            height: 17px;

            border: 2px solid rgba(255, 255, 255, 0.4);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;

            display: none;
        }

        .submit-btn.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .back-login {
            text-align: center;

            margin-top: 24px;

            font-size: 14px;

            color: var(--muted);
        }

        .back-login a {
            color: var(--primary);

            font-weight: 700;

            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 24px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;

            display: flex;

            align-items: flex-start;

            gap: 10px;

            color: #777777;

            font-size: 12px;

            line-height: 1.5;
        }

        .security-icon {
            flex-shrink: 0;

            font-size: 15px;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 28px 22px;

                border-radius: 18px;
            }

            .heading h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-logo">
                J
            </div>

            <div class="brand-name">
                Jiga<span>to</span>
            </div>
        </div>


        <!-- Forgot Password Card -->
        <section class="card">

            <div class="icon" aria-hidden="true">
                🔐
            </div>


            <div class="heading">
                <h1>Forgot your password?</h1>

                <p>
                    Enter the email address associated with your
                    Jigato account and we'll send you a secure
                    password reset link.
                </p>
            </div>


            <!-- API Message -->
            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- Form -->
            <form
                id="forgotPasswordForm"
                class="form"
                novalidate
            >

                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span
                            class="input-icon"
                            aria-hidden="true"
                        >
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            maxlength="100"
                            required
                        >

                    </div>

                    <div
                        id="emailError"
                        class="field-error"
                    ></div>

                </div>


                <button
                    type="submit"
                    id="submitBtn"
                    class="submit-btn"
                >

                    <span class="btn-content">

                        <span class="spinner"></span>

                        <span id="buttonText">
                            Send Reset Link
                        </span>

                    </span>

                </button>

            </form>


            <!-- Back to Login -->
            <div class="back-login">

                Remember your password?

                <a href="/login">
                    Back to Login
                </a>

            </div>


            <!-- Security Note -->
            <div class="security-note">

                <span
                    class="security-icon"
                    aria-hidden="true"
                >
                    🛡️
                </span>

                <span>
                    For your security, password reset links are
                    temporary and can only be used once.
                </span>

            </div>

        </section>

    </main>


    <!-- Page Logic -->
    <script src="/js/forgot-password.js"></script>

</body>
</html>
